name: Physicsx
description: >-
  PhysicsX is an AI-native engineering software company, founded in 2020 and headquartered
  in London (Shoreditch) with an office in New York, building a platform that embeds physics
  AI directly into industrial engineering and manufacturing workflows. The platform unifies
  simulation, physics AI, data, and engineering applications into a single foundation, pairing
  fast AI-driven physics inference (Deep Physics Models) with numerical simulation to compress
  development cycles and expand the design space engineers can explore. It integrates with
  industry-standard CAE/CAD tooling (ANSYS, CATIA, Siemens NX, OpenFOAM, Siemens Star-CCM+),
  runs cloud-agnostically across AWS and Azure plus hybrid and on-premises deployments, and
  serves aerospace and defense, automotive, semiconductors, materials, and energy and renewables.
  Born out of Formula One, PhysicsX has raised roughly $489M across five rounds from investors
  including General Catalyst, Atomico, Temasek, NVIDIA, Siemens, and Applied Materials. There is
  no public developer API, SDK, or documentation surface at this time; this profile captures the
  company identity and public web properties.
